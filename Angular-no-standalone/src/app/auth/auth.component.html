<div class="row">
  <div class="col-xs-12 col-md-6 col-md-offset-3">
    <!-- <div class="alert alert-danger" *ngIf="error">
      <p>{{error}}</p>
    </div> -->
    <!-- use the shared component alert -->
     <app-alert [message]="error" *ngIf="error" (close)="onHandleClose()"/>
    <div *ngIf="isLoading" style="text-align: center;">
      <app-loader></app-loader> 
    </div>
    <form #authForm="ngForm" (ngSubmit)="onSubmit(authForm)" *ngIf="!isLoading">
      <div class="form-group">
        <label for="email">E-Mail</label>
        <input 
          type="email" 
          id="email" 
          class="form-control" 
          ngModel 
          name="email" 
          required 
          email
          />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-control" 
          ngModel 
          name="password"
          required
          minlength="8"
          />
      </div>
      <div>
        <button class="btn btn-primary" type="submit" [disabled]="!authForm.valid">{{isLoggedIn ? 'Login' : 'Sign Up'}}</button> |
        <button class="btn btn-primary" type="button" (click)="onSwitchMode()">Switch to {{isLoggedIn ? 'Sign Up' : 'Login'}}</button>
      </div>
    </form>
  </div>
</div>
