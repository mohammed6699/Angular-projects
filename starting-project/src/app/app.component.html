<app-header />
<main>
  <ul id="users">
    @for(user of users; track user.id){
      <li>
      <app-user 
        [user]="user" 
        (select)="onSelectUser($event)"
        [selected]="user.id === selctedUser"
      />
    </li>
    }
  </ul>
  @if(selctedUser){
   <app-tasks 
    [userName]="selectedUsers.name"
    [userId]="selectedUsers.id"
   />
  } @else {
    <p id="fallback">select a user to see their task</p>
  }
</main>
